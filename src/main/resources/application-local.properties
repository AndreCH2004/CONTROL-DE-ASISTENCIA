# Perfil local: H2 en memoria, sin Azure. Activar con SPRING_PROFILES_ACTIVE=local.
spring.datasource.url=jdbc:h2:mem:asistencia;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema y luego se cargan los datos de ejemplo de data-local.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql
spring.sql.init.encoding=UTF-8

# Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:asistencia, usuario sa)
spring.h2.console.enabled=true
