# Base de datos: Azure SQL Database. Los valores sensibles vienen de variables de entorno.
spring.datasource.url=jdbc:sqlserver://${DB_SERVIDOR}.database.windows.net:1433;database=bd_asistencia_nomina;encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

# El esquema lo controla el script db/bd_asistencia_nomina_ddl.sql: Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate

# Usuario de la base de datos que figura como autor de los registros automáticos (tablet o cierre).
app.usuario-auditoria-id=${APP_USUARIO_AUDITORIA_ID:1}

server.port=${PORT:8080}

# La sesión JPA se cierra al terminar el servicio; los DTO se arman dentro de la transacción.
spring.jpa.open-in-view=false
