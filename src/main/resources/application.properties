# Base de datos PostgreSQL (Render o local). Los valores sensibles vienen de variables de entorno.
# DB_URL ejemplo local:  jdbc:postgresql://localhost:5432/bd_asistencia_nomina
# DB_URL ejemplo Render: jdbc:postgresql://HOST:5432/NOMBRE_BD?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

# El esquema lo controla el script db/bd_asistencia_nomina_postgres.sql: Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate

# Usuario de la base de datos que figura como autor de los registros automáticos (tablet o cierre).
app.usuario-auditoria-id=${APP_USUARIO_AUDITORIA_ID:1}

server.port=${PORT:8080}

# La sesión JPA se cierra al terminar el servicio; los DTO se arman dentro de la transacción.
spring.jpa.open-in-view=false
