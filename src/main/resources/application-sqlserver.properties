# Perfil SQL Server local (Docker): base bd_asistencia_nomina en localhost:1433.
# Activar con SPRING_PROFILES_ACTIVE=sqlserver. La clave viene de DB_CLAVE (no se escribe aquí).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bd_asistencia_nomina;encrypt=true;trustServerCertificate=true;loginTimeout=30
spring.datasource.username=app_asistencia
spring.datasource.password=${DB_CLAVE}

# El esquema ya fue creado por el script; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
